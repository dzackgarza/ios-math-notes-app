name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project MathNotes.xcodeproj \
            -scheme MathNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MathNotes.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.1.$GITHUB_RUN_NUMBER" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Make unsigned IPA
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/MathNotes.xcarchive/Products/Applications/"*.app Payload/
          zip -r MathNotes.ipa Payload

      - name: Write SideStore source
        run: |
          jq -n \
            --arg version "0.1.$GITHUB_RUN_NUMBER" \
            --arg build "$GITHUB_RUN_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -f %z MathNotes.ipa)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/latest" \
            -f sidestore-source.jq > source.json

      - name: Publish IPA and source as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest MathNotes.ipa source.json \
            --title "Latest build ($GITHUB_SHA)" \
            --notes "Unsigned; install with SideStore."
