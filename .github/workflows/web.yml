name: Web app

# Called by engine.yml with the engine module it built (artifact engine-module).
on:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hosts/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: engine-module
          path: hosts/web/src/engine/wasm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium firefox webkit

      - name: Type check and build
        run: |
          bunx tsc -b
          bunx --bun vite build

      - name: Vitest Browser Mode in Chromium, Firefox and WebKit
        run: bunx vitest run

      - name: Deploy to nginx
        run: |
          sudo apt-get install -y nginx
          sudo mkdir -p /var/www/math-notes
          sudo cp -r dist/. /var/www/math-notes/
          printf 'server {\n  listen 80 default_server;\n  include %s;\n}\n' "$PWD/deploy/nginx-math-notes.conf" \
            | sudo tee /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Playwright against the deployment
        run: bunx playwright test
