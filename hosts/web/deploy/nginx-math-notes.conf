# Math Notes web app: include inside a `server` block. `just web-deploy` puts
# the site in /var/www/math-notes. Hashed files under assets/ never change;
# index.html and sw.js revalidate (vite-plugin-pwa guide "Deploy: NGINX").
location /math-notes/ {
    root /var/www;
    try_files $uri $uri/ /math-notes/index.html;
    add_header Cache-Control "no-cache";
}
location /math-notes/assets/ {
    root /var/www;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
